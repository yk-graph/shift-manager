name: shift-manager-dev

services:
  db:
    image: mysql:8.4
    container_name: shift-manager-dev-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shift_manager
      MYSQL_USER: shift
      MYSQL_PASSWORD: shift
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-proot']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql-data:
    name: shift-manager-dev-mysql-data
